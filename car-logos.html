<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Car Logo Scramble</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            touch-action: none;
        }

        #game-container {
            position: relative;
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 750px; 
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        #controls {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #444;
        }

        #controls input {
            transform: scale(1.6);
            cursor: pointer;
        }

        .nav-btn {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .nav-btn:hover {
            background-color: #5a6268;
        }

        #car-image {
            width: 100%;
            height: 200px;
            object-fit: contain;
            margin-bottom: 40px;
        }

        .slots-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 60px;
            min-height: 120px;
            flex-wrap: wrap;
            width: 100%;
        }

        .slot {
            width: 100px;
            height: 110px;
            border-bottom: 8px solid #adb5bd;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .slot::before {
            content: attr(data-hint);
            position: absolute;
            font-size: 50px;
            font-weight: bold;
            color: #e9ecef;
            display: none;
            pointer-events: none;
        }

        body.show-hints .slot::before {
            display: block;
        }

        .letters-pool {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 40px;
            background: #f8f9fa;
            border-radius: 25px;
            min-height: 120px;
            flex-wrap: wrap;
            width: 100%;
        }

        .letter-tile {
            width: 100px;
            height: 100px;
            background-color: #007bff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            font-weight: bold;
            border-radius: 15px;
            cursor: grab;
            box-shadow: 0 6px 0 #0056b3;
            z-index: 5;
        }

        #status {
            margin-top: 30px;
            height: 40px;
            font-size: 28px;
            font-weight: bold;
            color: #28a745;
        }
    </style>
</head>
<body id="body-tag">

<div id="game-container">
    <div id="top-bar">
        <button class="nav-btn" id="prev-btn" onclick="changeLevel(-1)">← Prev</button>
        <div id="controls">
            <input type="checkbox" id="hint-checkbox" onchange="toggleHints()">
            <label for="hint-checkbox">Hints</label>
        </div>
        <button class="nav-btn" id="next-btn" onclick="changeLevel(1)">Next →</button>
    </div>

    <img id="car-image" src="" alt="Logo">
    
    <div id="interaction-area">
        <div class="slots-row" id="slots-container"></div>
        <div class="letters-pool" id="pool"></div>
        <div id="status"></div>
    </div>
</div>

<script>
    const cars = [
        { name: 'AUDI', img: 'logos/audi.png' },
        { name: 'RAM', img: 'logos/ram.png' },
        { name: 'OPEL', img: 'logos/opel.png' },
        { name: 'SEAT', img: 'logos/seat.png' },
        { name: 'LADA', img: 'logos/lada.png' },
    ];

    let currentIndex = 0;
    let currentCarObj = null;

    function applySavedPrefs() {
        const hintPref = localStorage.getItem('carGameShowHints') === 'true';
        document.getElementById('hint-checkbox').checked = hintPref;
        document.getElementById('body-tag').classList.toggle('show-hints', hintPref);
    }

    function toggleHints() {
        const isChecked = document.getElementById('hint-checkbox').checked;
        document.getElementById('body-tag').classList.toggle('show-hints', isChecked);
        localStorage.setItem('carGameShowHints', isChecked);
    }

    function changeLevel(direction) {
        currentIndex += direction;
        if (currentIndex < 0) currentIndex = cars.length - 1;
        if (currentIndex >= cars.length) currentIndex = 0;
        loadLevel();
    }

    function loadLevel() {
        currentCarObj = cars[currentIndex];
        
        const slotsContainer = document.getElementById('slots-container');
        const pool = document.getElementById('pool');
        const img = document.getElementById('car-image');
        const status = document.getElementById('status');
        
        status.innerText = "";
        img.src = currentCarObj.img;
        slotsContainer.innerHTML = '';
        pool.innerHTML = '';

        // Create Slots
        for (let i = 0; i < currentCarObj.name.length; i++) {
            const slot = document.createElement('div');
            slot.className = 'slot';
            slot.setAttribute('data-hint', currentCarObj.name[i]);
            slotsContainer.appendChild(slot);
            
            new Sortable(slot, {
                group: 'carLetters',
                animation: 150,
                onAdd: function (evt) {
                    if (evt.to.children.length > 1) {
                        const newItem = evt.item;
                        const oldItem = Array.from(evt.to.children).find(el => el !== newItem);
                        
                        if (evt.from.classList.contains('slot')) {
                            evt.from.appendChild(oldItem);
                        } else {
                            pool.appendChild(oldItem);
                        }
                    }
                    checkAnswer();
                }
            });
        }

        // Guaranteed Scramble Logic
        let scrambledLetters = currentCarObj.name.split('');
        
        // Keep shuffling until the scrambled version is NOT equal to the original name
        // (Only if word length > 1)
        if (scrambledLetters.length > 1) {
            do {
                scrambledLetters.sort(() => Math.random() - 0.5);
            } while (scrambledLetters.join('') === currentCarObj.name);
        }

        scrambledLetters.forEach(char => {
            const tile = document.createElement('div');
            tile.className = 'letter-tile';
            tile.innerText = char;
            pool.appendChild(tile);
        });

        new Sortable(pool, {
            group: 'carLetters',
            animation: 150,
            onAdd: checkAnswer
        });
    }

    function checkAnswer() {
        const slots = document.querySelectorAll('.slot');
        let guess = "";
        let filled = 0;

        slots.forEach(slot => {
            if (slot.children[0]) {
                guess += slot.children[0].innerText;
                filled++;
            }
        });

        if (filled === currentCarObj.name.length && guess === currentCarObj.name) {
            document.getElementById('status').innerText = "Correct!";
            setTimeout(() => {
                if (currentIndex < cars.length - 1) {
                    changeLevel(1);
                } else {
                    document.getElementById('status').innerText = "All Logos Completed!";
                }
            }, 1500);
        }
    }

    applySavedPrefs();
    loadLevel();
</script>

</body>
</html>
