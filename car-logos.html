<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Logo Scramble</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            touch-action: none;
        }

        #game-container {
            position: relative;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        /* The Skip Button */
        #skip-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 35px;
            height: 35px;
            background: #ff4d4d;
            color: white;
            border: none;
            border-radius: 50%;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        #car-image {
            width: 100%;
            height: 150px;
            object-fit: contain;
            margin-bottom: 25px;
        }

        .slots-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 35px;
            min-height: 60px;
            flex-wrap: wrap;
        }

        .slot {
            width: 45px;
            height: 55px;
            border-bottom: 3px solid #ced4da;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .letters-pool {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            min-height: 60px;
            flex-wrap: wrap;
        }

        .letter-tile {
            width: 45px;
            height: 45px;
            background-color: #007bff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: grab;
            box-shadow: 0 3px 0 #0056b3;
        }

        #status {
            margin-top: 15px;
            height: 25px;
            font-weight: bold;
            color: #28a745;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- <button id="skip-btn" onclick="nextLogo()">X</button> -->
    <img id="car-image" src="" alt="Logo">
    <div class="slots-row" id="slots-container"></div>
    <div class="letters-pool" id="pool"></div>
    <div id="status"></div>
</div>

<script>
    const cars = [
        { name: 'AUDI', img: 'logos/audi.png' },
        // { name: 'RAM', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/Mercedes-Logo.svg/640px-Mercedes-Logo.svg.png' },
        // { name: 'OPEL', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Chevrolet-logo.svg/640px-Chevrolet-logo.svg.png' },
        // { name: 'SEAT', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Mitsubishi_logo.svg/640px-Mitsubishi_logo.svg.png' },
        { name: 'LADA', img: 'logos/lada.png' },
    ];

    let currentCar = 0;
    const pool = document.getElementById('pool');

    function init() {
        // random car that correct is false
        // shuffle the cars array
        cars.sort(() => Math.random() - 0.5);
        const availableCars = cars.filter(car => !car.correct);
        if (availableCars.length === 0) {
            document.getElementById('status').innerText = "Congratulations! You've completed all logos!";
            return;
        }
        const car = availableCars[0];
        const slotsContainer = document.getElementById('slots-container');
        const img = document.getElementById('car-image');
        document.getElementById('status').innerText = "";

        img.src = car.img;
        slotsContainer.innerHTML = '';
        pool.innerHTML = '';

        // Create Slots
        for (let i = 0; i < car.name.length; i++) {
            const slot = document.createElement('div');
            slot.className = 'slot';
            slotsContainer.appendChild(slot);
            
            new Sortable(slot, {
                group: 'carLetters',
                animation: 150,
                onAdd: function (evt) {
                    if (evt.to.children.length > 1) {
                        const existingLetter = Array.from(evt.to.children).find(el => el !== evt.item);
                        pool.appendChild(existingLetter);
                    }
                    checkAnswer();
                }
            });
        }

        // Create Scrambled Letters
        const scrambled = car.name.split('').sort(() => Math.random() - 0.5);
        scrambled.forEach(char => {
            const tile = document.createElement('div');
            tile.className = 'letter-tile';
            tile.innerText = char;
            pool.appendChild(tile);
        });

        new Sortable(pool, {
            group: 'carLetters',
            animation: 150,
            onAdd: checkAnswer
        });
    }

    function checkAnswer() {
        const slots = document.querySelectorAll('.slot');
        let guess = "";
        let filled = 0;

        slots.forEach(slot => {
            if (slot.children[0]) {
                guess += slot.children[0].innerText;
                filled++;
            }
        });

        if (filled === cars[currentCar].name.length && guess === cars[currentCar].name) {
            document.getElementById('status').innerText = "Correct!";
            cars[currentCar].correct = true;
            setTimeout(nextLogo, 1200);
        }
    }

    function nextLogo() {
        currentCar = (currentCar + 1) % cars.length;
        init();
    }

    init();
</script>

</body>
</html>
