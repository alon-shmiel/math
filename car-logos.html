<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Car Logo Scramble</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            touch-action: none; /* Prevents pull-to-refresh and vertical scrolling issues */
        }

        #game-container {
            position: relative;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* The Skip Button */
        #skip-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 35px;
            height: 35px;
            background: #ff4d4d;
            color: white;
            border: none;
            border-radius: 50%;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }

        #car-image {
            width: 100%;
            height: 150px;
            object-fit: contain;
            margin-bottom: 25px;
        }

        #interaction-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .slots-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 35px;
            min-height: 60px;
            flex-wrap: wrap;
            width: 100%;
        }

        .slot {
            width: 45px;
            height: 55px;
            border-bottom: 3px solid #ced4da;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .letters-pool {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            min-height: 60px;
            flex-wrap: wrap;
            width: 100%;
        }

        .letter-tile {
            width: 45px;
            height: 45px;
            background-color: #007bff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: grab;
            box-shadow: 0 3px 0 #0056b3;
        }

        #status {
            margin-top: 15px;
            height: 25px;
            font-weight: bold;
            color: #28a745;
        }

        /* Landscape Mode Support */
        @media (orientation: landscape) and (max-height: 600px) {
            body {
                padding: 10px;
            }

            #game-container {
                flex-direction: row;
                max-width: 700px;
                padding: 15px 25px;
            }

            #car-image {
                width: 40%;
                height: 120px;
                margin-bottom: 0;
                margin-right: 20px;
            }

            #interaction-area {
                width: 60%;
            }

            .slots-row {
                margin-bottom: 15px;
                min-height: 50px;
            }

            .letters-pool {
                padding: 10px;
                min-height: 50px;
            }

            .slot {
                height: 45px;
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- <button id="skip-btn" onclick="init()">X</button> -->
    <img id="car-image" src="" alt="Logo">
    <div id="interaction-area">
        <div class="slots-row" id="slots-container"></div>
        <div class="letters-pool" id="pool"></div>
        <div id="status"></div>
    </div>
</div>

<script>
    const cars = [
        { name: 'AUDI', img: 'logos/audi.png' },
        { name: 'RAM', img: 'logos/ram.png' },
        { name: 'OPEL', img: 'logos/opel.png' },
        { name: 'SEAT', img: 'logos/seat.png' },
        { name: 'LADA', img: 'logos/lada.png' },
    ];

    let currentCarObj = null;
    const pool = document.getElementById('pool');

    function init() {
        // shuffle the cars array
        cars.sort(() => Math.random() - 0.5);
        const availableCars = cars.filter(car => !car.correct);
        
        if (availableCars.length === 0) {
            document.getElementById('status').innerText = "Congratulations! You've completed all logos!";
            document.getElementById('slots-container').innerHTML = '';
            pool.innerHTML = '';
            document.getElementById('car-image').style.display = 'none';
            return;
        }
        
        currentCarObj = availableCars[0];
        const slotsContainer = document.getElementById('slots-container');
        const img = document.getElementById('car-image');
        document.getElementById('status').innerText = "";

        img.src = currentCarObj.img;
        slotsContainer.innerHTML = '';
        pool.innerHTML = '';

        // Create Slots
        for (let i = 0; i < currentCarObj.name.length; i++) {
            const slot = document.createElement('div');
            slot.className = 'slot';
            slotsContainer.appendChild(slot);
            
            new Sortable(slot, {
                group: 'carLetters',
                animation: 150,
                onAdd: function (evt) {
                    if (evt.to.children.length > 1) {
                        const existingLetter = Array.from(evt.to.children).find(el => el !== evt.item);
                        pool.appendChild(existingLetter);
                    }
                    checkAnswer();
                }
            });
        }

        // Create Scrambled Letters
        const scrambled = currentCarObj.name.split('').sort(() => Math.random() - 0.5);
        scrambled.forEach(char => {
            const tile = document.createElement('div');
            tile.className = 'letter-tile';
            tile.innerText = char;
            pool.appendChild(tile);
        });

        new Sortable(pool, {
            group: 'carLetters',
            animation: 150,
            onAdd: checkAnswer
        });
    }

    function checkAnswer() {
        const slots = document.querySelectorAll('.slot');
        let guess = "";
        let filled = 0;

        slots.forEach(slot => {
            if (slot.children[0]) {
                guess += slot.children[0].innerText;
                filled++;
            }
        });

        if (filled === currentCarObj.name.length && guess === currentCarObj.name) {
            document.getElementById('status').innerText = "Correct!";
            currentCarObj.correct = true;
            setTimeout(init, 1200);
        }
    }

    init();
</script>

</body>
</html>
